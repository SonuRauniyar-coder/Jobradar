spring:
  application:
    name: jobradar
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jobradar:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:}
    ttl-hours: ${JWT_TTL_HOURS:24}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  scan:
    user-agent: "JobRadar/1.0 (personal job search)"
    timeout-seconds: 20
    retries: 2
    backoff-millis: 1000
    # At the 1 request/second limit this is what keeps a 500-company scan under 30 minutes.
    max-job-pages-per-company: 25
    playwright-enabled: ${PLAYWRIGHT_ENABLED:true}
    # Keep false: it stops a pasted URL from making the server call its own network.
    allow-private-hosts: ${SCAN_ALLOW_PRIVATE_HOSTS:false}
    cron: ${SCAN_CRON:0 0 6 * * *}
    zone: ${SCAN_ZONE:Asia/Kolkata}
    schedule-enabled: ${SCAN_SCHEDULE_ENABLED:true}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
    to: ${MAIL_TO:}
